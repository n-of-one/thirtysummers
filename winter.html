<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thirtysummers &mdash; winter</title>
  </head>
  <body>
    <!--
      The winter screen on its own, at /winter.html, so it can be looked at and
      changed without playing a summer first. The markup is the markup that
      goes into index.html once the screen is settled; the numbers in it come
      from a fixture in src/winterPrototype.ts, not from a world.

      Three panels: what was gathered and what it sells for, what winter costs,
      and what the town has. Each one adds up to a total on its own last line,
      right where the amounts already are.
    -->
    <div id="view">
      <div id="winter">
        <div class="winter-card">
          <header class="winter-head">
            <h1 id="winter-year">Winter</h1>
          </header>

          <!--
            Four panels in a two-row grid: the haul and what winter costs side
            by side, the family beside them and as tall as both, and the town
            underneath, as wide as the two above it. Everything is pinned to
            the top of the view, so a line appearing anywhere -- a level
            gained, a row of food -- moves nothing else.
          -->
          <div class="winter-cols">
            <section class="winter-panel winter-haul">
              <h2>Summer haul</h2>
              <ul class="winter-list" id="winter-sold"></ul>
              <ul class="winter-list" id="winter-materials"></ul>
              <ul class="winter-list winter-foot-list" id="winter-sales"></ul>
            </section>

            <section class="winter-panel winter-winter">
              <h2>Winter upkeep</h2>
              <ul class="winter-list" id="winter-upkeep"></ul>
              <ul class="winter-list winter-foot-list" id="winter-totals"></ul>
              <ul class="winter-list winter-foot-list" id="winter-balance"></ul>
            </section>

            <section class="winter-panel winter-family">
              <h2>Family</h2>
              <ul class="winter-list" id="winter-family"></ul>
              <ul class="winter-list winter-foot-list" id="winter-family-gold"></ul>
              <ul class="winter-list winter-foot-list" id="winter-family-final"></ul>
              <ul class="winter-list winter-foot-list" id="winter-family-total"></ul>
            </section>

            <hr class="winter-rule" />

            <section class="winter-panel winter-town">
              <h2>Town</h2>
              <ul class="winter-shop" id="winter-shop"></ul>
            </section>
          </div>

          <footer class="winter-foot">
            <button id="winter-next">Next summer</button>
          </footer>
        </div>
      </div>
    </div>

    <script type="module" src="/src/winterPrototype.ts"></script>
  </body>
</html>
